<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Escrow Agent: AI-Verified Payments on PayPal</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🛡️</text></svg>">
  <style>
    :root {
      --bg: #0b1020;
      --card: #141b34;
      --line: #26305a;
      --tx: #e8ecff;
      --mut: #97a2d1;
      --ac: #4f8cff;
      --gemini: #8b5cf6;
      --ok: #27c281;
      --warn: #f5b53d;
      --bad: #ff5d6c;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font: 15px/1.5 system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg);
      color: var(--tx);
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 24px;
      border-bottom: 1px solid var(--line);
      background: rgba(20, 27, 52, 0.6);
      backdrop-filter: blur(8px);
      position: sticky;
      top: 0;
      z-index: 100;
    }
    header .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 18px;
      font-weight: 700;
    }
    .badge-gemini {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      background: linear-gradient(135deg, #4f8cff, #8b5cf6);
      color: #fff;
      font-size: 11px;
      font-weight: 600;
      padding: 3px 8px;
      border-radius: 99px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    main {
      max-width: 880px;
      margin: 0 auto;
      padding: 24px 16px;
    }
    a { color: var(--ac); text-decoration: none; }
    a:hover { text-decoration: underline; }
    h1, h2, h3 { margin: 0.5em 0; }
    .mut { color: var(--mut); }
    .card, .ms {
      display: block;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 18px;
      margin: 14px 0;
      color: var(--tx);
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    a.card:hover {
      border-color: var(--ac);
      text-decoration: none;
      box-shadow: 0 4px 20px rgba(79, 140, 255, 0.15);
    }
    input, textarea, select {
      width: 100%;
      background: #0e1430;
      color: var(--tx);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 10px 12px;
      margin: 6px 0;
      font: inherit;
    }
    input:focus, textarea:focus, select:focus {
      outline: none;
      border-color: var(--ac);
    }
    .row {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 10px;
    }
    .btn {
      background: var(--ac);
      color: #fff;
      border: 0;
      border-radius: 8px;
      padding: 10px 18px;
      font: inherit;
      font-weight: 600;
      cursor: pointer;
      margin: 8px 8px 0 0;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: opacity 0.2s, transform 0.1s;
    }
    .btn:hover:not(:disabled) { opacity: 0.95; transform: translateY(-1px); }
    .btn:active:not(:disabled) { transform: translateY(0); }
    .btn.gemini {
      background: linear-gradient(135deg, #4f8cff 0%, #8b5cf6 100%);
    }
    .btn.alt { background: transparent; border: 1px solid var(--line); color: var(--tx); }
    .btn.alt:hover:not(:disabled) { background: rgba(255, 255, 255, 0.05); }
    .btn.bad { background: var(--bad); }
    .btn.ok { background: var(--ok); }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .b {
      display: inline-block;
      padding: 3px 10px;
      border-radius: 99px;
      font-size: 12px;
      font-weight: 600;
      margin: 4px 6px 0 0;
      background: #2a3463;
      text-transform: capitalize;
    }
    .b.pending { background: #3b4266; }
    .b.funded { background: #1f4aa8; }
    .b.submitted { background: #8a6410; }
    .b.verified { background: #14724d; }
    .b.released { background: #106644; }
    .b.disputed { background: #9b2c38; }
    .b.refunded { background: #555c70; }
    .rep {
      background: #0f1738;
      border: 1px solid #24336a;
      border-radius: 8px;
      padding: 14px;
      margin-top: 12px;
    }
    .rep-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }
    .rep-score {
      font-size: 13px;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 6px;
      background: rgba(39, 194, 129, 0.2);
      color: var(--ok);
    }
    .rep-score.low {
      background: rgba(255, 93, 108, 0.2);
      color: var(--bad);
    }
    .rep ul { padding-left: 20px; margin: 8px 0; }
    .rep li { margin: 6px 0; }
    .met { color: var(--ok); }
    .unmet { color: var(--bad); }
    .log {
      font-size: 12px;
      color: var(--mut);
      margin-top: 12px;
      border-top: 1px dashed var(--line);
      padding-top: 8px;
      line-height: 1.6;
    }
    #toast {
      display: none;
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      background: #1c152a;
      color: #fff;
      border: 1px solid var(--ac);
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.5);
      padding: 12px 20px;
      border-radius: 10px;
      max-width: 90%;
      font-size: 14px;
      z-index: 200;
    }
    .spinner {
      display: inline-block;
      width: 14px;
      height: 14px;
      border: 2px solid rgba(255,255,255,0.3);
      border-radius: 50%;
      border-top-color: #fff;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <header>
    <div class="brand">
      <span>🛡️ Escrow Agent</span>
      <span class="badge-gemini">✨ Gemini 2.0 Flash</span>
    </div>
    <label class="mut">
      Viewing as:
      <select id="role" style="width:auto; margin:0 0 0 6px;">
        <option value="client">Client (Buyer / Funds)</option>
        <option value="freelancer">Freelancer (Seller / Delivers)</option>
      </select>
    </label>
  </header>

  <main id="app"></main>
  <div id="toast"></div>

  <script>
    const $ = s => document.querySelector(s);
    const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
    let role = 'client', cfg, draft = null;

    const toast = (m, isError = true) => {
      const t = $('#toast');
      t.textContent = m;
      t.style.borderColor = isError ? 'var(--bad)' : 'var(--ok)';
      t.style.display = 'block';
      clearTimeout(toast.t);
      toast.t = setTimeout(() => t.style.display = 'none', 6000);
    };

    async function api(url, method = 'GET', body) {
      const r = await fetch('/api' + url, {
        method,
        headers: { 'Content-Type': 'application/json' },
        body: body ? JSON.stringify(body) : undefined
      });
      const j = await r.json();
      if (!r.ok) throw new Error(j.error || 'Server request failed');
      return j;
    }

    async function busy(btn, fn) {
      const orig = btn.innerHTML;
      btn.disabled = true;
      btn.innerHTML = '<span class="spinner"></span> Working…';
      try {
        await fn();
      } catch (e) {
        toast(e.message, true);
      } finally {
        btn.disabled = false;
        btn.innerHTML = orig;
      }
    }

    const badge = s => `<span class="b ${s}">${s}</span>`;
    const total = d => (d.milestones || []).reduce((a, m) => a + (Number(m.amount) || 0), 0).toFixed(2);

    async function home() {
      const deals = await api('/deals');
      $('#app').innerHTML = `
        <section class="card">
          <h2>1. Describe your agreement in plain English</h2>
          <p class="mut">Gemini AI will analyze your scope and draft objective, verifiable milestones with USD pricing.</p>
          <textarea id="txt" rows="4" placeholder="e.g. I will pay Ravi $300 for a 3-page portfolio site: $100 for the UI design mockup, $200 once it is live on Vercel and mobile-responsive."></textarea>
          <button id="dr" class="btn gemini">✨ Draft Milestones with Gemini AI</button>
        </section>
        <div id="review"></div>

        <h2 style="margin-top:30px;">Active Deals</h2>
        ${deals.map(d => `
          <a class="card" href="#/deal/${d._id}">
            <div style="display:flex; justify-content:space-between; align-items:baseline;">
              <b>${esc(d.title)}</b>
              <span class="mut">$${total(d)} USD</span>
            </div>
            <p class="mut" style="margin:4px 0 8px 0; font-size:13px;">${esc(d.summary || 'Escrow Agreement')}</p>
            <div class="mut" style="font-size:13px;">${esc(d.clientName)} → ${esc(d.freelancerName)}</div>
            <div style="margin-top:8px;">${d.milestones.map(m => badge(m.status)).join('')}</div>
          </a>
        `).join('') || '<p class="mut">No agreements found. Create one above to test the escrow workflow!</p>'}
      `;

      $('#dr').onclick = e => busy(e.target, async () => {
        const text = $('#txt').value.trim();
        if (!text) throw new Error('Please enter a description for the deal first');
        draft = await api('/draft', 'POST', { text });
        review();
      });
    }

    function review() {
      $('#review').innerHTML = `
        <section class="card" style="border-color: var(--ac);">
          <h2>2. Review and create agreement</h2>
          <p class="mut">Gemini has generated the following structure. You can edit any field before saving.</p>
          <div class="row">
            <input id="cn" placeholder="Your name (Client)" value="Client User">
            <input id="fn" placeholder="Freelancer name" value="Freelancer Pro">
            <input id="fe" type="email" placeholder="Freelancer PayPal email" value="sb-seller@example.com">
          </div>
          <label class="mut" style="font-size:12px;">Agreement Title:</label>
          <input id="ti" value="${esc(draft.title)}">
          <p class="mut" style="font-size:13px; margin:4px 0 12px 0;">${esc(draft.summary)}</p>

          <h3>Milestones:</h3>
          ${draft.milestones.map((m, i) => `
            <div class="ms">
              <label class="mut" style="font-size:12px;">Milestone ${i + 1} Title:</label>
              <input data-k="title" data-i="${i}" value="${esc(m.title)}">
              <label class="mut" style="font-size:12px;">Acceptance Criteria (for Gemini Verifier):</label>
              <textarea data-k="criteria" data-i="${i}" rows="2">${esc(m.criteria)}</textarea>
              <label class="mut" style="font-size:12px;">Amount (USD):</label>
              <input data-k="amount" data-i="${i}" type="number" step="0.01" value="${m.amount}">
            </div>
          `).join('')}

          <button id="cr" class="btn ok">Confirm & Create Deal</button>
        </section>
      `;

      document.querySelectorAll('[data-k]').forEach(el => {
        el.oninput = () => {
          draft.milestones[el.dataset.i][el.dataset.k] = el.dataset.k === 'amount'
            ? parseFloat(el.value) || 0
            : el.value;
        };
      });

      $('#cr').onclick = e => busy(e.target, async () => {
        const d = await api('/deals', 'POST', {
          title: $('#ti').value,
          summary: draft.summary,
          clientName: $('#cn').value,
          freelancerName: $('#fn').value,
          freelancerEmail: $('#fe').value,
          milestones: draft.milestones
        });
        toast('Deal created successfully!', false);
        location.hash = '#/deal/' + d._id;
      });
    }

    async function sdk() {
      if (window.paypal) return;
      cfg ??= await api('/config');
      if (!cfg.clientId) {
        throw new Error('PayPal Client ID is not configured on the server');
      }
      await new Promise((ok, no) => {
        const s = document.createElement('script');
        s.src = `https://www.paypal.com/sdk/js?client-id=${cfg.clientId}&currency=USD&intent=authorize`;
        s.onload = ok;
        s.onerror = () => no(new Error('PayPal SDK failed to load. Check your PAYPAL_CLIENT_ID.'));
        document.head.appendChild(s);
      });
    }

    function card(d, m, i) {
      const r = m.aiReport, dp = m.dispute;
      const c = role === 'client', f = role === 'freelancer';

      return `
        <div class="ms">
          <div style="display:flex; justify-content:space-between; align-items:center;">
            <b>${i + 1}. ${esc(m.title)}</b>
            <span><b>$${m.amount.toFixed(2)} USD</b> ${badge(m.status)}</span>
          </div>
          <p class="mut" style="margin:8px 0;"><b>Acceptance Criteria:</b> ${esc(m.criteria)}</p>

          ${m.submission ? `<p><b>Submission:</b> ${esc(m.submission)}</p>` : ''}

          ${r ? `
            <div class="rep">
              <div class="rep-header">
                <b>✨ Gemini Verification: ${esc(r.verdict).toUpperCase()}</b>
                <span class="rep-score ${r.score < 70 ? 'low' : ''}">Score: ${esc(r.score)}/100</span>
              </div>
              <p style="margin:4px 0 8px 0; font-size:14px;">${esc(r.summary)}</p>
              <ul>
                ${(r.criteria || []).map(x => `
                  <li class="${x.met ? 'met' : 'unmet'}">
                    ${x.met ? '✔' : '✘'} <b>${esc(x.criterion)}</b><br>
                    <span class="mut" style="font-size:12px;">Evidence: ${esc(x.evidence)}</span>
                  </li>
                `).join('')}
              </ul>
            </div>
          ` : ''}

          ${dp ? `
            <div class="rep" style="border-color: var(--warn);">
              <b>⚖️ Dispute Raised by ${esc(dp.by)}:</b>
              <p class="mut" style="margin:4px 0 8px 0;">"${esc(dp.reason)}"</p>
              <div style="border-top: 1px dashed var(--line); padding-top:8px;">
                <b>Gemini Mediator Recommendation:</b> ${esc(dp.recommended_release_percent)}% to freelancer
                <p style="font-size:13px; margin:4px 0;">${esc(dp.reasoning)}</p>
                ${dp.message_to_client ? `<p class="mut" style="font-size:12px;"><b>Advice to Client:</b> ${esc(dp.message_to_client)}</p>` : ''}
                ${dp.message_to_freelancer ? `<p class="mut" style="font-size:12px;"><b>Advice to Freelancer:</b> ${esc(dp.message_to_freelancer)}</p>` : ''}
              </div>
            </div>
          ` : ''}

          ${m.status === 'pending' && c ? `<div id="pp-${i}" style="max-width:320px; margin-top:12px;"></div>` : ''}
          ${m.status === 'pending' && f ? '<p class="mut">Awaiting client to fund this milestone via PayPal Escrow authorization.</p>' : ''}

          ${['funded', 'submitted'].includes(m.status) && f ? `
            <textarea id="sub${i}" rows="2" placeholder="Describe your deliverable work and include live links (e.g. https://... or PR url)">${esc(m.submission || '')}</textarea>
            <button class="btn" data-a="submit" data-i="${i}">Submit Deliverable</button>
          ` : ''}

          ${m.status === 'submitted' ? `
            <button class="btn gemini" data-a="verify" data-i="${i}">✨ Run Gemini AI Verification</button>
          ` : ''}

          ${m.status === 'verified' && c ? `
            <button class="btn ok" data-a="settle" data-p="100" data-i="${i}">Approve & Release 100%</button>
          ` : ''}

          ${m.status === 'submitted' && c ? `
            <button class="btn ok" data-a="settle" data-p="100" data-i="${i}">Direct Approve & Release</button>
          ` : ''}

          ${m.status === 'funded' && c ? `
            <button class="btn alt" data-a="settle" data-p="0" data-i="${i}">Cancel & Void Escrow (Refund 100%)</button>
          ` : ''}

          ${['submitted', 'verified'].includes(m.status) ? `
            <button class="btn bad" data-a="dispute" data-i="${i}">Raise Dispute</button>
          ` : ''}

          ${m.status === 'disputed' ? `
            <button class="btn gemini" data-a="settle" data-p="${esc(dp.recommended_release_percent)}" data-i="${i}">
              Accept Gemini Ruling (${esc(dp.recommended_release_percent)}% Payout)
            </button>
          ` : ''}

          <div class="log">${(m.log || []).map(esc).join('<br>')}</div>
        </div>
      `;
    }

    async function deal(id) {
      const d = await api('/deals/' + id);
      const base = i => `/deals/${id}/milestones/${i}`;

      $('#app').innerHTML = `
        <a href="#/">← Back to All Deals</a>
        <h1 style="margin-top:12px;">${esc(d.title)}</h1>
        <p class="mut">${esc(d.summary || '')}</p>
        <p>
          Client: <b>${esc(d.clientName)}</b> · 
          Freelancer: <b>${esc(d.freelancerName)}</b> (${esc(d.freelancerEmail)}) · 
          Total: <b>$${total(d)} USD</b>
        </p>
        ${d.milestones.map((m, i) => card(d, m, i)).join('')}
      `;

      document.querySelectorAll('[data-a]').forEach(b => {
        b.onclick = () => busy(b, async () => {
          const i = b.dataset.i, a = b.dataset.a;
          if (a === 'submit') {
            const val = $('#sub' + i).value.trim();
            if (!val) throw new Error('Submission description cannot be empty');
            await api(base(i) + '/submit', 'POST', { submission: val });
            toast('Deliverable submitted for review!', false);
          }
          if (a === 'verify') {
            await api(base(i) + '/verify', 'POST');
            toast('Gemini AI verification complete!', false);
          }
          if (a === 'settle') {
            await api(base(i) + '/settle', 'POST', { percent: +b.dataset.p });
            toast('Milestone settlement completed!', false);
          }
          if (a === 'dispute') {
            const r = prompt('Please explain the reason for the dispute:');
            if (!r) return;
            await api(base(i) + '/dispute', 'POST', { reason: r, party: role });
            toast('Dispute submitted to Gemini mediator!', false);
          }
          deal(id);
        });
      });

      if (role === 'client' && d.milestones.some(m => m.status === 'pending')) {
        try {
          await sdk();
          d.milestones.forEach((m, i) => {
            if (m.status === 'pending' && $('#pp-' + i)) {
              paypal.Buttons({
                createOrder: async () => (await api(base(i) + '/order', 'POST')).id,
                onApprove: async () => {
                  await api(base(i) + '/authorize', 'POST');
                  toast('Funds successfully held in escrow authorization!', false);
                  deal(id);
                },
                onError: e => toast(String(e), true)
              }).render('#pp-' + i);
            }
          });
        } catch (e) {
          toast(e.message, true);
        }
      }
    }

    const route = () => {
      const m = location.hash.match(/^#\/deal\/(\w+)/);
      (m ? deal(m[1]) : home()).catch(e => toast(e.message, true));
    };

    $('#role').onchange = e => {
      role = e.target.value;
      route();
    };

    addEventListener('hashchange', route);
    route();
  </script>
</body>
</html>
